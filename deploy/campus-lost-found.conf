# Apache2 virtual host for the Campus Lost & Found System.
# DocumentRoot is the /public folder ONLY, so config/, includes/, storage/ (private
# evidence files) and database/ are never reachable from the web.
<VirtualHost *:80>
    ServerName localhost

    DocumentRoot /var/www/campus-lost-found/public

    <Directory /var/www/campus-lost-found/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    <Directory /var/www/campus-lost-found/public/uploads>
        Options -Indexes

        <FilesMatch "\.(php|phtml|phar|php[0-9])$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/campus-lost-found-error.log
    CustomLog ${APACHE_LOG_DIR}/campus-lost-found-access.log combined
</VirtualHost>
